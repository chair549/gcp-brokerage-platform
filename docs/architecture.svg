  <rect x="952" y="132" width="140" height="62" rx="6" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
  <text x="1022" y="155" font-size="12" font-weight="600" fill="#b06000" text-anchor="middle">Staging</text>
  <text x="1022" y="172" font-size="10" fill="#8a6100" text-anchor="middle">stg_* views</text>
  <text x="1022" y="186" font-size="9.5" fill="#a1743c" text-anchor="middle">clean · type · dedupe</text>

  <rect x="952" y="216" width="140" height="72" rx="6" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
  <text x="1022" y="238" font-size="12" font-weight="600" fill="#b06000" text-anchor="middle">Star schema</text>
  <text x="1022" y="255" font-size="10" fill="#8a6100" text-anchor="middle">dim_customer (SCD2)</text>
  <text x="1022" y="269" font-size="10" fill="#8a6100" text-anchor="middle">dim_instrument</text>
  <text x="1022" y="283" font-size="10" fill="#8a6100" text-anchor="middle">fct_trades</text>

  <rect x="952" y="310" width="140" height="48" rx="6" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
  <text x="1022" y="331" font-size="12" font-weight="600" fill="#b06000" text-anchor="middle">Marts</text>
  <text x="1022" y="347" font-size="10" fill="#8a6100" text-anchor="middle">mart_daily_trading</text>

  <line x1="908" y1="163" x2="946" y2="163" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1022" y1="194" x2="1022" y2="210" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1022" y1="288" x2="1022" y2="304" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ ORCHESTRATION ============ -->
  <rect x="220" y="416" width="872" height="50" rx="6" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="656" y="438" font-size="12.5" font-weight="600" fill="#202124" text-anchor="middle">Cloud Composer (Airflow)</text>
  <text x="656" y="455" font-size="10.5" fill="#5f6368" text-anchor="middle">daily DAG · retries · dbt test as quality gate</text>

  <line x1="288" y1="416" x2="288" y2="364" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="475" y1="416" x2="475" y2="364" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="848" y1="416" x2="848" y2="364" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- ============ TERRAFORM ============ -->
  <rect x="24" y="496" width="1068" height="48" rx="6" fill="#f3effd" stroke="#7b4bcf" stroke-width="1.5"/>
  <text x="558" y="518" font-size="12.5" font-weight="600" fill="#4b2b8c" text-anchor="middle">Terraform</text>
  <text x="558" y="535" font-size="10.5" fill="#6b4bb0" text-anchor="middle">buckets with lifecycle policies · BigQuery datasets · Pub/Sub topics and DLQ policy · service accounts and IAM · Composer</text>

