  <text x="108" y="176" font-size="11" fill="#3c72c4" text-anchor="middle">Python</text>

  <rect x="220" y="132" width="136" height="62" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="288" y="158" font-size="12.5" font-weight="600" fill="#174ea6" text-anchor="middle">Pub/Sub</text>
  <text x="288" y="176" font-size="11" fill="#5f6368" text-anchor="middle">topic + subscription</text>

  <rect x="400" y="132" width="150" height="62" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="475" y="155" font-size="12.5" font-weight="600" fill="#174ea6" text-anchor="middle">Dataflow</text>
  <text x="475" y="172" font-size="11" fill="#5f6368" text-anchor="middle">Apache Beam</text>
  <text x="475" y="187" font-size="10" fill="#80868b" text-anchor="middle">window · validate · dedupe</text>

  <rect x="594" y="132" width="150" height="62" rx="6" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
  <text x="669" y="157" font-size="12.5" font-weight="600" fill="#b06000" text-anchor="middle">raw_dev</text>
  <text x="669" y="175" font-size="10.5" fill="#8a6100" text-anchor="middle">trading_events</text>

  <line x1="176" y1="163" x2="214" y2="163" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="356" y1="163" x2="394" y2="163" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="550" y1="163" x2="588" y2="163" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

