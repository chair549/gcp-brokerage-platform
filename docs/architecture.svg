  <text x="848" y="234" font-size="13.5" font-weight="600" fill="#9c3418" text-anchor="middle">dbt</text>
  <text x="848" y="252" font-size="10.5" fill="#c74a2e" text-anchor="middle">snapshot · run · test</text>

  <path d="M 744 163 L 766 163 L 766 240 L 782 240" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 744 327 L 766 327 L 766 250 L 782 250" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

