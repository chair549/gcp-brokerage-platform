<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d93025"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="32" y="40" font-size="21" font-weight="600" fill="#202124">GCP Brokerage Data Platform</text>
  <text x="32" y="62" font-size="13" fill="#5f6368">Streaming and batch ingestion into a dimensional BigQuery warehouse</text>

  <!-- Simulated sources boundary -->
  <rect x="24" y="92" width="168" height="290" rx="8" fill="#fafafa" stroke="#bdc1c6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="108" y="114" font-size="10.5" font-weight="600" fill="#5f6368" text-anchor="middle" letter-spacing="0.6">SIMULATED SOURCES</text>

  <!-- Column headers -->
  <text x="288" y="88" font-size="10.5" font-weight="600" fill="#80868b" text-anchor="middle" letter-spacing="0.6">INGEST</text>
  <text x="640" y="88" font-size="10.5" font-weight="600" fill="#80868b" text-anchor="middle" letter-spacing="0.6">RAW LAYER</text>
  <text x="960" y="88" font-size="10.5" font-weight="600" fill="#80868b" text-anchor="middle" letter-spacing="0.6">MODELLED</text>

  <!-- ============ STREAMING ROW ============ -->
  <rect x="40" y="132" width="136" height="62" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
