  <line x1="356" y1="327" x2="394" y2="327" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="550" y1="327" x2="588" y2="327" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>

