  <text x="669" y="265" font-size="10.5" fill="#b3261e" text-anchor="middle">trading_events_dlq</text>

  <path d="M 475 194 L 475 253 L 588 253" fill="none" stroke="#d93025" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="492" y="228" font-size="10" fill="#d93025">malformed</text>

