  <text x="475" y="340" font-size="10" fill="#80868b" text-anchor="middle">WRITE_TRUNCATE · idempotent</text>

  <rect x="594" y="296" width="150" height="62" rx="6" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
  <text x="669" y="318" font-size="12.5" font-weight="600" fill="#b06000" text-anchor="middle">raw_dev</text>
  <text x="669" y="335" font-size="10.5" fill="#8a6100" text-anchor="middle">customers · instruments</text>
  <text x="669" y="349" font-size="10.5" fill="#8a6100" text-anchor="middle">fx_rates</text>

