name: 'brokerage'
version: '1.0.0'
config-version: 2

profile: 'brokerage'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  brokerage:
    staging:
      +materialized: view
    marts:
      +materialized: table

snapshots:
  brokerage:
    +target_schema: staging_dev